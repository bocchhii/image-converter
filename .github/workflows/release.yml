name: Build and Release

on:
  push:
    tags: ["v*"]      # e.g. push the tag v1.0.0 to publish a release
  workflow_dispatch:   # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Put the version into the app
        # the app compares its own version with the newest release to offer updates:
        # APP_VERSION = "dev" becomes e.g. APP_VERSION = "2.2.0" (from the tag v2.2.0)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $code = Get-Content master_converter.py -Raw -Encoding utf8
          $code = $code -replace '(?m)^APP_VERSION = "dev"', "APP_VERSION = `"$version`""
          Set-Content master_converter.py $code -NoNewline -Encoding utf8
          Select-String -Path master_converter.py -Pattern '^APP_VERSION = '
      - name: Build the exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MasterConverter --icon icon.ico --add-data "icon.ico;." --add-data "icon.png;." --collect-all tkinterdnd2 --collect-all pillow_heif --collect-all imageio_ffmpeg --collect-all rawpy --collect-all resvg_py master_converter.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        # the version comes from the tag: v2.0.0 -> "2.0.0" (a run started by hand, with no
        # tag, keeps the default in installer.iss)
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            & $iscc "/DMyAppVersion=$version" installer.iss
          } else {
            & $iscc installer.iss
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterConverter-Setup
          path: installer_output/MasterConverter-Setup.exe
      - name: Publish a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/MasterConverter-Setup.exe
