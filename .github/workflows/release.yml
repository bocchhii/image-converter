name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pillow pillow-heif tkinterdnd2 pyinstaller
      - name: Build the exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ImageConverter --icon icon.ico --add-data "icon.ico;." --add-data "icon.png;." --collect-all tkinterdnd2 --collect-all pillow_heif image_converter.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build the installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Keep the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImageConverter-Setup
          path: installer_output/ImageConverter-Setup.exe
      - name: Publish a GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer_output/ImageConverter-Setup.exe
